<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>系统维护中</title>
  <style>
    :root {
      color-scheme: light;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #1f2937;
      background: #f3f4f6;
    }

    body {
      display: grid;
      min-height: 100vh;
      margin: 0;
      place-items: center;
    }

    main {
      padding: 2rem;
      text-align: center;
    }

    h1 {
      margin: 0 0 1rem;
      font-size: clamp(1.75rem, 5vw, 2.5rem);
    }

    p {
      margin: 0;
      color: #6b7280;
      font-size: 1rem;
    }
  </style>
</head>
<body>
  <main>
    <h1>系统正在维护</h1>
    <p>系统正在维护或升级，请稍后再试。</p>
  </main>
</body>
</html>
