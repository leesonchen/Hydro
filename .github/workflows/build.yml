name: CI

# Run automated checks on pushed commits and pull requests; no daily schedule.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Cancel obsolete builds for the same branch/PR. Keep the latest verification run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CI: true
  YARN_ENABLE_IMMUTABLE_INSTALLS: 'false'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Check out
      uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 2
    - name: Set up Node
      uses: actions/setup-node@v4
      with:
        node-version: 22
    - name: Enable repository Yarn version
      run: corepack enable
    - name: Get yarn cache directory path
      id: yarn-cache-dir-path
      run: echo "dir=$(yarn config get cacheFolder)" >> "$GITHUB_OUTPUT"
    - uses: actions/cache@v4
      with:
        path: ${{ steps.yarn-cache-dir-path.outputs.dir }}
        key: yarn-${{ runner.os }}-${{ hashFiles('package.json', 'packages/*/package.json', 'framework/*/package.json', '.yarnrc.yml') }}
        restore-keys: |
          yarn-${{ runner.os }}-
    - name: Config And Install
      run: |
        git config --global user.name undefined
        git config --global user.email i@undefined.moe
        yarn install
      env:
        LICENSE_KEY: ${{ secrets.MAXMIND_KEY }}
    - name: Generate icon types
      run: yarn build:ui:iconfont
    - name: Lint
      run: yarn lint:ci
    - name: Build types
      run: yarn build
    - name: Build production UI
      run: yarn build:ui:production:webpack
    - name: Prepare isolated test database
      run: node -e 'require("mongodb-memory-server").MongoMemoryServer.create().then(server => server.stop()).catch(error => { console.error(error); process.exitCode = 1; })'
    - name: Test
      run: NODE_OPTIONS="--require=$GITHUB_WORKSPACE/test/classroom-feedback-test-isolate.cjs" yarn test
