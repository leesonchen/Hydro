{% extends "layout/basic.html" %}
{% block content %}
<style>
  .course-manage-tabs { display:flex; border-bottom:1px solid #ddd; margin-bottom:20px; }
  .course-manage-tab { border:0; border-bottom:3px solid transparent; background:transparent; padding:12px 16px; cursor:pointer; }
  .course-manage-tab.active { color:#ed5f82; border-bottom-color:#ed5f82; }
  .course-manage-app .button { margin:3px 6px 3px 0; }
  .course-manage-app .data-table { min-width:620px; }
  .course-manage-body { overflow-x:auto; }
</style>
<div class="row responsive-sidebar-layout">
  <div class="medium-9 columns">
    <div class="section">
      <div class="section__header"><h1 class="section__title">{{ tdoc.title }} · 课程管理</h1></div>
      <div class="section__body course-manage-body" id="course"></div>
    </div>
  </div>
  <div class="medium-3 columns">{% include "course_sidebar.html" %}</div>
</div>
{% endblock %}
